name: Build OpenBSD Very Cool System

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pillow
    
    - name: Build executable
      run: |
        pyinstaller --onefile --windowed --name "openbsdverycoolsystem" --add-data "рыбка.jpeg;." --add-data "nya.ico;." --add-data "ljnn.mp3;." --hidden-import pygame larp.py
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: openbsdverycoolsystem
        path: dist/*.exe
        retention-days: 14
